<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AssetTrack Admin Login</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(
                    135deg,
                    #1e3c72,
                    #2a5298,
                    #4f46e5);
        }

        .login-container{
            width:400px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            color:white;
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo i{
            font-size:55px;
            margin-bottom:10px;
        }

        .logo h1{
            font-size:30px;
        }

        .logo p{
            color:#ddd;
            margin-top:5px;
        }

        .input-group{
            margin-top:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;
            left:15px;
            top:15px;
            color:#555;
        }

        .input-box input{
            width:100%;
            padding:14px 14px 14px 45px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:15px;
        }

        .login-btn{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#10b981;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#059669;
            transform:translateY(-2px);
        }

        .error{
            background:#ffdddd;
            color:red;
            padding:10px;
            border-radius:8px;
            margin-top:15px;
            text-align:center;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:#ddd;
            font-size:13px;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <i class="fas fa-laptop-house"></i>
        <h1>AssetTrack</h1>
        <p>Asset Management System</p>
    </div>

    <div th:if="${error}" class="error">
        <span th:text="${error}"></span>
    </div>

    <form action="/login" method="post">

        <div class="input-group">

            <label>Username</label>

            <div class="input-box">
                <i class="fas fa-user"></i>

                <input type="text"
                       name="username"
                       placeholder="Enter Username"
                       required>
            </div>

        </div>

        <div class="input-group">

            <label>Password</label>

            <div class="input-box">
                <i class="fas fa-lock"></i>

                <input type="password"
                       name="password"
                       placeholder="Enter Password"
                       required>
            </div>

        </div>

        <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt"></i>
            Login
        </button>

    </form>

    <div class="footer">
        <p>MCA Mini Project</p>
        <p>Asset Management System</p>
        <br>
        <p>Developed By <b>Shubham</b></p>
    </div>

</div>

</body>
</html>
